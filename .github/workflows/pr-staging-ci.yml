name: PR CI for Staging

# Set up fresh for this repo (ci-target-schema.md section 10 step 13) - there was no prior
# pr.yml/test.yml to split. Job structure follows the cross-project hybrid model (section 4.2):
# static-checks and build-and-test run in parallel with no needs: dependency between them.
# detect-backmerge below is copied from Rezepte's own thorough merge-parent + tree-diff check
# (already the most thorough variant across all projects, see ci-target-schema.md section
# 10 step 9 / section 4.2) - it is the template the other projects are copying, not something
# to weaken here.

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this PR is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    # Hybrid job model (ci-target-schema.md section 4.2): runs in parallel with build-and-test,
    # with no needs: between them, so a format/security/lint failure is visible within seconds
    # instead of waiting for the multi-minute build+test run to finish. windows-latest matches
    # this app's genuinely Windows-only production runtime (Negotiate/Windows Authentication,
    # Serilog EventLog sink) - see build-and-package/action.yml.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore Schnittstellenzentrale.slnx
        shell: pwsh

      - name: Format check
        # Gate 1. --severity error restricts this to whitespace/style plus genuine analyzer
        # errors - analyzer-level warnings are Gate 3's concern; without this flag, plain
        # `dotnet format --verify-no-changes` also fails on any warning-level analyzer
        # diagnostic.
        run: dotnet format Schnittstellenzentrale.slnx --verify-no-changes --no-restore --severity error
        shell: pwsh

      - name: Security scan
        # Gate 2 - shared composite action, see .github/actions/security-scan.
        uses: ./.github/actions/security-scan
        with:
          solution-path: Schnittstellenzentrale.slnx
          artifact-name: vulnerable-packages-pr

      - name: Static analysis
        # Gate 3. A fresh -t:Rebuild with this exact flag during the migration surfaced 13 real
        # issues (nullable-reference bugs, an ambiguous/broken XML-doc cref, and Windows-only
        # API calls not guarded for CA1416) - all fixed in source rather than suppressed here,
        # plus one narrowly justified #pragma warning disable EF1001 at its point of use in
        # ProviderFilteredMigrationsAssemblies.cs (deliberate, documented internal-EF-API usage
        # with no supported alternative). No WarningsNotAsErrors exclusions are needed for this
        # gate.
        run: dotnet build Schnittstellenzentrale.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true
        shell: pwsh

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore Schnittstellenzentrale.slnx
        shell: pwsh

      - name: Build
        # Also triggers Schnittstellenzentrale.Tests' own InstallPlaywright MSBuild target
        # (AfterTargets="Build"), which installs the Chromium browser used by the Playwright
        # step below - no separate "install Playwright browsers" step is needed here, unlike
        # FinanceManager/Rezepte's npm-based Playwright setup.
        run: dotnet build Schnittstellenzentrale.slnx --configuration Release --no-restore
        shell: pwsh

      - name: Test
        # Gate 4 (blocking): the regular lane runs only deterministic tests - the
        # environment-sensitive ones (Playwright/Chromium, real Kestrel binding on ports
        # 5099-5104, temp filesystem) carry the trait Category=OsInterface and run in the
        # separate best-effort job os-interface-tests below. This is the only lane that
        # collects coverage and feeds the threshold below (ci-target-schema.md section 4.5).
        # xunit.v3/MTP: dotnet test runs in Microsoft.Testing.Platform mode (global.json
        # test.runner). xunit.v3 provides --filter (VSTest syntax), --coverage and
        # --report-trx as test-app args after `--`.
        run: dotnet test --solution Schnittstellenzentrale.slnx --configuration Release --no-build --results-directory src/Schnittstellenzentrale.Tests/TestResults -- --filter "Category!=OsInterface" --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --report-trx --report-trx-filename test-results.trx
        shell: pwsh

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11
        shell: pwsh

      - name: Generate coverage report
        run: reportgenerator "-reports:src/Schnittstellenzentrale.Tests/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"
        shell: pwsh

      - name: Enforce coverage threshold
        # Gate 5: hard 70% line-coverage minimum (ci-target-schema.md section 4.5).
        # Only the regular lane (Category!=OsInterface) feeds this - the best-effort
        # OS-interface lane deliberately collects no coverage so the threshold never
        # depends on a non-blocking lane (measured 72.77% / line-rate 0.7277 locally
        # on the regular lane alone after the OsInterface tagging - i.e. already
        # excluding ImpressumServiceTests).
        env:
          COVERAGE_THRESHOLD: '70'
        run: |
          $summary = Get-Content coverage-report/Summary.txt -Raw
          if ($summary -notmatch "Line coverage:\s*([\d.,]+)%") {
            throw "Could not determine line coverage from the generated report."
          }
          $lineCoverage = [double]($matches[1] -replace ',', '.')
          $threshold = [double]$env:COVERAGE_THRESHOLD
          Write-Host "Line coverage: $lineCoverage% (threshold: $threshold%)"
          if ($lineCoverage -lt $threshold) {
            throw "Code coverage $lineCoverage% is below the required threshold of $threshold%."
          }
        shell: pwsh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-pr
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-pr
          path: |
            src/Schnittstellenzentrale.Tests/TestResults/*.trx
          retention-days: 14

  os-interface-tests:
    name: os-interface tests
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    # The OS-interface lane (Playwright/Chromium, real Kestrel binding on ports
    # 5099-5104, temp filesystem, sz-impressum-* dirs) runs as its own best-effort
    # job instead of a step inside build & test: there its runtime counted against
    # the blocking job's 30-minute timeout and a cancellation would fail the whole
    # run even with every blocking test green. Job-level continue-on-error keeps
    # this lane non-blocking; findings stay visible via TRX/trace artifacts, the
    # analyzer report and quarantine issues.
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 45
    # Job-level permissions replace the workflow permissions - list all needed scopes
    # explicitly: contents:read (checkout), issues:write (quarantine issues),
    # actions:read (gh run list/download for the TRX history).
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore Schnittstellenzentrale.slnx
        shell: pwsh

      - name: Build
        # Triggers Schnittstellenzentrale.Tests' InstallPlaywright MSBuild target
        # (AfterTargets="Build") -> Chromium install, same as in build-and-test.
        run: dotnet build Schnittstellenzentrale.slnx -c Release --no-restore
        shell: pwsh

      - name: Test OS interface
        # No coverage: the OS lane is excluded from the 70% coverage gate so the
        # threshold never depends on a best-effort lane.
        run: dotnet test --solution Schnittstellenzentrale.slnx -c Release --no-build --results-directory src/Schnittstellenzentrale.Tests/TestResults -- --filter "Category=OsInterface" --report-trx --report-trx-filename test-results-os-interface.trx
        shell: pwsh

      - name: Retry flaky tests once
        # if: failure() is deliberately broad: on a build failure or missing TRX the
        # script reports "keine Flaky-Fehlschlaege" and exits 0, so the original
        # failing step stays the leading signal. Persistent flaky failures fail this
        # step - the job still stays non-blocking via job-level continue-on-error.
        if: failure()
        # No trailing `exit $LASTEXITCODE`: the script itself calls `exit 0`/`exit 1`,
        # which ends the whole step pwsh session with that code - a follow-up line
        # would be dead code.
        run: |
          & scripts/Retry-FlakyTests.ps1 -TestProject src/Schnittstellenzentrale.Tests/Schnittstellenzentrale.Tests.csproj -PrimaryTrx src/Schnittstellenzentrale.Tests/TestResults/test-results-os-interface.trx -Configuration Release
        shell: pwsh

      - name: Download OS-interface TRX history
        # Artifact-chain persistence for the flake statistics: pulls this workflow's
        # own test-results-os-interface artifacts of the last ~15 runs so the analyzer
        # sees more than the current run. Fully best-effort - missing artifacts
        # (older runs, 14d retention) or API errors never fail the step.
        if: always()
        continue-on-error: true
        run: |
          & scripts/Download-OsInterfaceTrxHistory.ps1 -WorkflowFile pr-staging-ci.yml -ArtifactName test-results-os-interface-pr -Destination trx-history -MaxRuns 15
        shell: pwsh

      - name: Analyze flaky test results
        # Pure visibility report over this run's TestResults plus the downloaded
        # history (always exit 0); writes the quarantine candidates JSON for the
        # next step.
        if: always()
        run: |
          & scripts/Analyze-FlakyTestResults.ps1 -Path src/Schnittstellenzentrale.Tests/TestResults, trx-history -CandidatesFile flaky-quarantine-candidates.json
        shell: pwsh

      - name: Create quarantine issues
        # Creates a deduplicated "Quarantaene: <test>" issue per analyzer candidate.
        # No-op on empty/missing candidates file; best-effort - the script tolerates
        # missing issues:write rights on fork PRs and exits 0 with a warning.
        if: always()
        run: |
          & scripts/New-FlakyQuarantineIssue.ps1 -CandidatesFile flaky-quarantine-candidates.json
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-os-interface-pr
          path: |
            src/Schnittstellenzentrale.Tests/TestResults/test-results-os-interface*.trx
          retention-days: 14

      - name: Upload Playwright traces
        # Moved here from build-and-test: PlaywrightTestBase writes a
        # Screenshots+Snapshots+Sources trace per test to
        # playwright-traces/{TestName}-HHmmssfff.zip, anchored at the repo root
        # via TestPaths.FindRepoRoot() so this path glob always matches.
        # if: always() so a failed run leaves real diagnostic evidence
        # (open with `npx playwright show-trace <file>.zip`).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-pr
          path: playwright-traces/
          retention-days: 14

  back-merge-skip:
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Back-merge detected
        run: echo "Back-merge PR from main detected. Redundant checks are skipped."
