name: Pre-Release

# Filename stays staging-ci.yml (only the display name is "Pre-Release") - see
# ci-target-schema.md section 3. staging-to-main-promotion.yml's workflow_run trigger
# references this display name, not the filename; both were added together in the same
# commit so the promotion chain never points at a name that doesn't exist yet.
#
# Same two parallel jobs as pr-staging-ci.yml (static-checks, build-and-test; hybrid model,
# ci-target-schema.md section 4.2/4.3), followed by version + prerelease. detect-backmerge
# below is Rezepte's thorough merge-parent + tree-diff check (the cross-project template, see
# section 10 step 9). Versioning uses semantic-release (section 4.8) rather than any custom
# script - this repo already had semantic-release wired up for release.yml before this
# migration, just not yet for a staging pre-release channel.

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Schnittstellenzentrale.slnx
        shell: pwsh

      - name: Format check
        run: dotnet format Schnittstellenzentrale.slnx --verify-no-changes --no-restore --severity error
        shell: pwsh

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: Schnittstellenzentrale.slnx
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        run: dotnet build Schnittstellenzentrale.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true
        shell: pwsh

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Schnittstellenzentrale.slnx
        shell: pwsh

      - name: Build
        run: dotnet build Schnittstellenzentrale.slnx --configuration Release --no-restore
        shell: pwsh

      - name: Test
        run: dotnet test Schnittstellenzentrale.slnx --configuration Release --no-build --filter "FullyQualifiedName!~Playwright" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test Playwright
        continue-on-error: true
        run: dotnet test Schnittstellenzentrale.slnx --configuration Release --no-build --filter "FullyQualifiedName~Playwright" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results-playwright.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11
        shell: pwsh

      - name: Generate coverage report
        run: reportgenerator "-reports:src/Schnittstellenzentrale.Tests/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"
        shell: pwsh

      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: '70'
        run: |
          $summary = Get-Content coverage-report/Summary.txt -Raw
          if ($summary -notmatch "Line coverage:\s*([\d.,]+)%") {
            throw "Could not determine line coverage from the generated report."
          }
          $lineCoverage = [double]($matches[1] -replace ',', '.')
          $threshold = [double]$env:COVERAGE_THRESHOLD
          Write-Host "Line coverage: $lineCoverage% (threshold: $threshold%)"
          if ($lineCoverage -lt $threshold) {
            throw "Code coverage $lineCoverage% is below the required threshold of $threshold%."
          }
        shell: pwsh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-staging
          path: |
            src/Schnittstellenzentrale.Tests/TestResults/*.trx
          retention-days: 14

      - name: Upload Playwright traces
        # PlaywrightTestBase.DisposeAsync() writes a Screenshots+Snapshots+Sources trace per
        # test to playwright-traces/{TestName}.zip (relative to the repo root, since "Test
        # Playwright" runs dotnet test from there). Uploaded unconditionally (if: always())
        # so a failed run leaves real diagnostic evidence (open the .zip with
        # `npx playwright show-trace <file>.zip`) instead of only a bare pass/fail count.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-staging
          path: playwright-traces/
          retention-days: 14

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
      rc_version: ${{ steps.rc.outputs.rc_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine next version
        # release.config.cjs only lists "main" as a release branch (see that file's own
        # comment); staging is deliberately not a configured prerelease branch there, matching
        # Rezepte's precedent (avoids semantic-release's own github plugin racing this job's
        # own pre-release creation below). The --branches override treats "staging" as a plain
        # release branch for this one dry-run only, so the resulting X.Y.Z carries no
        # prerelease identifier - the RC suffix (lowercase, section 4.6) is appended manually
        # in the next step instead.
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $output = & npx semantic-release --dry-run --no-ci --branches staging 2>&1 | Out-String
          Write-Host "semantic-release output:"
          Write-Host $output

          $version = $null
          $changed = $false
          if ($output -match 'The next release version is ([0-9]+\.[0-9]+\.[0-9]+(?:[-+][^\s]+)?)') {
            $version = $Matches[1]
            $changed = $true
            Write-Host "Next release version: $version"
          } else {
            Write-Host "No new release version determined."
          }

          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
          "changed=$($changed.ToString().ToLowerInvariant())" | Add-Content -Path $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Determine RC number
        if: steps.semver.outputs.changed == 'true'
        id: rc
        shell: pwsh
        run: |
          $version = "${{ steps.semver.outputs.version }}"
          $existing = @(git tag --list "v$version-rc.*")
          $rcNumber = $existing.Count + 1
          "rc_number=$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT
          "rc_tag=v$version-rc.$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT
          # RC-suffixed version without the leading "v" (e.g. "1.2.3-rc.1"), distinct from
          # rc_tag ("v1.2.3-rc.1"). Passed as build-and-package's release-version input so both
          # the packaged asset's file name and update.json's own "version" field carry the RC
          # suffix.
          "rc_version=$version-rc.$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate release notes for update manifest
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="${{ needs.version.outputs.rc_tag }}"
          $notes = ($json | ConvertFrom-Json).body
          $notesPath = Join-Path $PWD "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          "notes_path=release-notes.md" | Add-Content -Path $env:GITHUB_OUTPUT

          $delimiter = "NOTES_EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$delimiter"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter
        shell: pwsh

      - name: Build and package release candidate
        id: build
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}
          release-notes: ${{ steps.notes.outputs.notes }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATHS: ${{ steps.build.outputs.asset-paths }}
          RELEASE_MANIFEST_PATH: ${{ steps.build.outputs.manifest-path }}
        run: |
          $tag = "${{ needs.version.outputs.rc_tag }}"
          $assets = @($env:RELEASE_ASSET_PATHS -split ';') + @($env:RELEASE_MANIFEST_PATH)
          gh release create $tag @assets `
            --target $env:GITHUB_SHA `
            --title $tag `
            --prerelease `
            --notes-file "${{ steps.notes.outputs.notes_path }}"
        shell: pwsh
