name: Monthly Architecture & Security Review

# Schedule-driven workflow that creates a monthly GitHub issue asking
# @softwarewerkstatt to perform an architecture and security review of the
# codebase. Before creating the issue, it ensures the
# 'automated-architecture-review' label exists and checks whether an open
# issue with that label is still pending from a previous cycle - if so, no
# duplicate is created. The label/create logic lives in the shared composite
# action ./.github/actions/create-review-issue.
#
# Can also be triggered manually via workflow_dispatch; the duplicate check
# applies there as well.
on:
  schedule:
    # Monthly on the 1st at 05:00 UTC.
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-architecture-security-review
  cancel-in-progress: false

jobs:
  create-review-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create review issue
        uses: ./.github/actions/create-review-issue
        with:
          label: automated-architecture-review
          label-color: '5319E7'
          label-description: Automated monthly architecture and security review issue
          issue-title-prefix: '[Review] Architektur- und Sicherheitsreview'
          cadence: monthly
          issue-body: |
            @softwarewerkstatt

            Bitte führe ein Architektur- und Sicherheitsreview durch.

            Prüfe insbesondere:

            - Neue Sicherheitsrisiken in verwendeten Frameworks und Bibliotheken
            - Bekannte Schwachstellen (CVEs) in NuGet-Abhängigkeiten
            - Neue Empfehlungen für ASP.NET Core, Blazor, .NET und verwandte Technologien
            - Änderungen bei Authentifizierung und Autorisierung
            - Neue oder inzwischen bevorzugte Design Patterns
            - Veraltete, abgekündigte oder problematische APIs
            - Verbesserungsmöglichkeiten hinsichtlich Wartbarkeit, Erweiterbarkeit und Testbarkeit
            - Aktuelle Empfehlungen zu Logging, Telemetrie und Monitoring
            - Relevante Erkenntnisse aus der Community, Microsoft-Dokumentation und Sicherheitsmeldungen

            Erstelle eine priorisierte Liste konkreter Handlungsempfehlungen.
